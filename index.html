<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cazac TransGrup CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}
button,input,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:#eef3f9}.box{width:min(420px,92vw);background:#fff;padding:30px;border-radius:16px;box-shadow:0 12px 40px #0002}
input,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd2dc;border-radius:8px;background:#fff}.btn{padding:12px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700}.error{display:none;background:#fff1f0;color:#b42318;padding:10px;border-radius:8px;margin-bottom:12px}
.app{display:none}.side{position:fixed;top:0;bottom:0;width:225px;background:#111827;color:#fff;padding:20px}.side button{display:block;background:transparent;color:#fff;border:0;width:100%;padding:12px;text-align:left;border-radius:8px}.side button:hover{background:#1f2937}
.main{margin-left:225px;padding:25px}section{display:none}section.on{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000a}.card b{display:block;font-size:28px;margin-top:8px}.panel{margin-top:18px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;white-space:nowrap}
.order-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.form{display:none;margin-top:15px;padding:18px;background:#f8fafc;border-radius:10px}.form.show{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{display:flex;gap:10px}.secondary{background:#64748b}.success{color:#067647;background:#ecfdf3;padding:10px;border-radius:8px;display:none;margin-bottom:12px}
@media(max-width:800px){.side{width:65px;padding:10px}.side h2{font-size:0}.side h2:after{content:"CTG";font-size:18px}.side button{font-size:0;text-align:center}.side button:before{content:"•";font-size:20px}.main{margin-left:65px;padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="box">
<h2>Cazac TransGrup</h2><p>CRM Curierat — Admin</p>
<div id="loginError" class="error"></div>
<label>Email</label><input id="emailInput" type="email" autocomplete="username">
<label>Parolă</label><input id="passwordInput" type="password" autocomplete="current-password">
<button id="loginBtn" class="btn" style="width:100%">Intră în CRM</button>
</div></div>

<div id="app" class="app">
<aside class="side"><h2>CTG CRM</h2>
<button onclick="show('dashboard')">📊 Dashboard</button>
<button onclick="show('orders')">📦 Comenzi</button>
<button onclick="show('clients')">👥 Clienți</button>
<button onclick="show('drivers')">🚚 Șoferi</button>
<button onclick="show('vehicles')">🚐 Vehicule</button>
<button onclick="logout()">↩ Ieșire</button>
</aside>
<main class="main">
<section id="dashboard" class="on"><h2>Dashboard</h2><div class="cards">
<div class="card">Comenzi<b id="cntOrders">0</b></div><div class="card">Livrate<b id="cntDelivered">0</b></div>
<div class="card">Șoferi<b id="cntDrivers">0</b></div><div class="card">Vehicule<b id="cntVehicles">0</b></div>
</div><div class="panel" id="recent"></div></section>

<section id="orders">
<div class="order-head"><h2>Comenzi</h2><button class="btn" onclick="toggleForm()">➕ Comandă nouă</button></div>
<div id="orderForm" class="form">
<h3>Comandă nouă</h3>
<div id="orderSuccess" class="success"></div><div id="orderError" class="error"></div>
<div class="formgrid">
<div><label>Client</label><select id="clientSel"></select></div>
<div><label>Șofer</label><select id="driverSel"></select></div>
<div><label>Destinatar</label><input id="recipient" placeholder="Nume destinatar"></div>
<div><label>Telefon</label><input id="phone" placeholder="069..."></div>
<div><label>Adresă</label><input id="address" placeholder="Stradă, număr"></div>
<div><label>Localitate</label><input id="city" value="Chișinău"></div>
<div><label>Încasare (lei)</label><input id="cash" type="number" value="0"></div>
<div><label>Greutate (kg)</label><input id="weight" type="number" step="0.01" value="0"></div>
</div>
<div class="actions"><button class="btn" onclick="saveOrder()">Salvează comanda</button><button class="btn secondary" onclick="toggleForm()">Închide</button></div>
</div>
<div class="panel" id="ordersTable"></div>
</section>

<section id="clients"><h2>Clienți</h2><div class="panel" id="clientsTable"></div></section>
<section id="drivers"><h2>Șoferi</h2><div class="panel" id="driversTable"></div></section>
<section id="vehicles"><h2>Vehicule</h2><div class="panel" id="vehiclesTable"></div></section>
</main></div>

<script>
"use strict";
const SUPABASE_URL="https://vroqxrcuqgwhmnacenfo.supabase.co";
const SUPABASE_KEY="sb_publishable_vVvOwJ7rNnCBKqdTjGd5Tw_QozYFQye";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let orders=[],clients=[],drivers=[],vehicles=[],currentProfile=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function table(h,rows){if(!rows.length)return"<p>Nu există date.</p>";return"<table><thead><tr>"+h.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
function show(id){document.querySelectorAll("section").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");if(id==="orders")fillSelects()}
function toggleForm(){$("orderForm").classList.toggle("show");if($("orderForm").classList.contains("show"))fillSelects()}
function fillSelects(){
 $("clientSel").innerHTML=clients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 $("driverSel").innerHTML=drivers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
}
async function login(){
 $("loginError").style.display="none";
 const email=$("emailInput").value.trim(),password=$("passwordInput").value;
 if(!email||!password){$("loginError").textContent="Introdu emailul și parola.";$("loginError").style.display="block";return}
 $("loginBtn").disabled=true;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 $("loginBtn").disabled=false;
 if(error){$("loginError").textContent=error.message;$("loginError").style.display="block";return}
 const {data:profile,error:profileError}=await db.from("profiles").select("name,role,driver_id").eq("id",data.user.id).maybeSingle();
 if(profileError){$("loginError").textContent="Profil utilizator: "+profileError.message;$("loginError").style.display="block";return}
 if(!profile){$("loginError").textContent="Utilizatorul nu are profil în CRM.";$("loginError").style.display="block";return}
 currentProfile=profile;
 $("login").style.display="none";$("app").style.display="block";
 await load();
}
$("loginBtn").onclick=login;$("passwordInput").onkeydown=e=>{if(e.key==="Enter")login()};
async function load(){
 const [o,c,d,v]=await Promise.all([
  db.from("orders").select("*").order("id",{ascending:false}),
  db.from("clients").select("*").order("id",{ascending:false}),
  db.from("drivers").select("*").order("id",{ascending:false}),
  db.from("vehicles").select("*").order("id",{ascending:false})
 ]);
 if(o.error||c.error||d.error||v.error){console.error(o.error,c.error,d.error,v.error);alert("Eroare la citirea datelor din Supabase.");return}
 orders=o.data||[];clients=c.data||[];drivers=d.data||[];vehicles=v.data||[];render();
}
function render(){
 $("cntOrders").textContent=orders.length;
 $("cntDelivered").textContent=orders.filter(x=>String(x.status||"").toLowerCase().startsWith("livrat")).length;
 $("cntDrivers").textContent=drivers.length;$("cntVehicles").textContent=vehicles.length;
 $("recent").innerHTML="<h3>Ultimele comenzi</h3>"+table(["Cod","Destinatar","Status"],orders.slice(0,8).map(x=>[x.code,x.recipient,x.status]));
 $("ordersTable").innerHTML=table(["Cod","Client","Destinatar","Adresă","Șofer","Cash","Greutate","Status","Acțiuni"],orders.map(x=>[
 x.code,clients.find(c=>c.id===x.client_id)?.name||"—",x.recipient,x.address,drivers.find(d=>d.id===x.driver_id)?.name||"—",x.cash,x.weight,x.status,
 currentProfile?.role==="driver"
 ? `<button class="btn" style="padding:7px 10px;margin-right:5px" onclick="driverDelivered(${x.id})">Livrată</button><button class="btn" style="padding:7px 10px;background:#dc2626" onclick="driverFailed(${x.id})">Nereușită</button>`
 : "—"]));
 $("clientsTable").innerHTML=table(["ID","Nume","Telefon","Tarif"],clients.map(x=>[x.id,x.name,x.phone,x.tariff]));
 $("driversTable").innerHTML=table(["ID","Nume","Telefon"],drivers.map(x=>[x.id,x.name,x.phone]));
 $("vehiclesTable").innerHTML=table(["ID","Număr","Model","Șofer","Consum"],vehicles.map(x=>[x.id,x.plate||x.registration_number,x.model,drivers.find(d=>d.id===x.driver_id)?.name||"—",x.fuel_consumption]));
}
async function driverDelivered(orderId){
 const {error}=await db.from("orders").update({status:"Livrată"}).eq("id",orderId);
 if(error){alert("Eroare: "+error.message);return} await load();
}
async function driverFailed(orderId){
 const reason=prompt("Motivul livrării nereușite:");
 if(reason===null)return;
 if(!reason.trim()){alert("Introdu motivul.");return}
 const {error}=await db.from("orders").update({status:"Nereușită"}).eq("id",orderId);
 if(error){alert("Eroare: "+error.message);return}
 await load(); alert("Comanda a fost marcată Nereușită. Motiv: "+reason.trim());
}
async function saveOrder(){
 $("orderError").style.display="none";$("orderSuccess").style.display="none";
 const client_id=Number($("clientSel").value),driver_id=Number($("driverSel").value);
 const recipient=$("recipient").value.trim(),phone=$("phone").value.trim(),address=$("address").value.trim(),city=$("city").value.trim()||"Chișinău";
 const cash=Number($("cash").value||0),weight=Number($("weight").value||0);
 if(!client_id||!driver_id||!recipient||!address){$("orderError").textContent="Completează Client, Șofer, Destinatar și Adresă.";$("orderError").style.display="block";return}
 const d=new Date(),code=`CTG-${String(d.getFullYear()).slice(-2)}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(Date.now()).slice(-6)}`;
 const {error}=await db.from("orders").insert({code,client_id,recipient,phone,address,city,cash,weight,driver_id,status:"Nouă"});
 if(error){$("orderError").textContent=error.message;$("orderError").style.display="block";return}
 $("recipient").value="";$("phone").value="";$("address").value="";$("cash").value="0";$("weight").value="0";
 $("orderSuccess").textContent="Comanda "+code+" a fost salvată."; $("orderSuccess").style.display="block";
 await load();
}
async function logout(){await db.auth.signOut();location.reload()}
(async()=>{const {data}=await db.auth.getSession();if(data.session){$("login").style.display="none";$("app").style.display="block";await load()}})();
</script>
</body></html>
